[project]
name = "corte-maker"
version = "0.1.0"
description = "Gera cortes verticais prontos para YouTube Shorts/TikTok a partir de lives e vídeos"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.2.0",
    "faster-whisper>=1.2.1",
    "imageio-ffmpeg>=0.8.1",
    "numpy>=2.5.5",
    "nvidia-cublas-cu12==12.9.2.10 ; sys_platform == 'win32'",
    "nvidia-cudnn-cu12>=9,<10 ; sys_platform == 'win32'",
    "yt-dlp[default]>=2026.10.26",
]

[project.scripts]
cortes = "cortes.cli:main"
cortes-ui = "cortes.servidor:main"
cortes-compilar = "cortes.compilar:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cortes"]
